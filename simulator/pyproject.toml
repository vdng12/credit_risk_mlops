[project]
name = "simulator"
version = "0.1.0"
description = "t-Copula synthetic lending data generator"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "polars>=1.0",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "pyyaml>=6.0",
]

[project.scripts]
simulator = "simulator.__main__:main"

[project.optional-dependencies]
sinks = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "boto3>=1.36",
    "pandas>=2.0",
    "pyarrow>=14",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
