# kind cluster config — Credit Risk MLOps
# One local node with port forwards matching the old compose stack.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: risk-cluster
nodes:
  - role: control-plane
    extraPortMappings:
      # Data layer
      - containerPort: 5432  # postgres-source
        hostPort: 5432
      - containerPort: 5433  # postgres-platform (host port = 5433)
        hostPort: 5433
      - containerPort: 8333  # seaweedfs S3
        hostPort: 8333
      - containerPort: 8888  # seaweedfs filer UI
        hostPort: 8888
      - containerPort: 9333  # seaweedfs master UI
        hostPort: 9333
      - containerPort: 9092  # redpanda
        hostPort: 9092
      # Catalog layer
      - containerPort: 8181  # polaris REST
        hostPort: 8181
      - containerPort: 8182  # polaris mgmt
        hostPort: 8182
      # ML platform
      - containerPort: 5000  # mlflow UI
        hostPort: 5000
      # Tools (optional)
      - containerPort: 5050  # pgAdmin
        hostPort: 5050
      - containerPort: 8080  # redpanda console
        hostPort: 8080