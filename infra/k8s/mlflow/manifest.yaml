apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
      - image: docker.io/library/risk-mlflow:latest
        name: mlflow
        imagePullPolicy: IfNotPresent
        command:
        - mlflow
        - server
        - --host
        - 0.0.0.0
        - --port
        - "5000"
        - --backend-store-uri
        - postgresql+psycopg2://platform:platform123@postgres-platform:5432/mlflow
        - --default-artifact-root
        - s3://mlflow/
        env:
        - name: AWS_ACCESS_KEY_ID
          value: seaweedfs
        - name: AWS_SECRET_ACCESS_KEY
          value: seaweedfs123
        - name: MLFLOW_S3_ENDPOINT_URL
          value: http://seaweedfs:8333
        - name: AWS_ENDPOINT_URL_S3
          value: http://seaweedfs:8333
        - name: AWS_REGION
          value: us-east-1
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
spec:
  type: NodePort
  selector:
    app: mlflow
  ports:
  - name: ui
    port: 5000
    targetPort: 5000
    nodePort: 5000