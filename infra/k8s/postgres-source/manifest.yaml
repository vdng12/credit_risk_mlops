apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-source-init
data:
  01-init-schema.sql: |
    -- Source OLTP schema — mirrors infra/postgres/init/01-init-schema.sql
    -- Analytical tables (pos_balances, card_balances, bureau, master) live in S3.
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    CREATE TABLE IF NOT EXISTS clients (
        client_id TEXT PRIMARY KEY, snapshot_date DATE NOT NULL,
        gender TEXT, birth_date DATE, age_years INTEGER,
        children_count INTEGER, family_members INTEGER,
        family_status TEXT, education_level TEXT, housing_type TEXT,
        income_total DOUBLE PRECISION, income_type TEXT,
        occupation_type TEXT, organization_type TEXT,
        employment_start_date DATE, days_employed INTEGER,
        owns_car BOOLEAN, owns_realty BOOLEAN, car_age DOUBLE PRECISION,
        region_rating TEXT, region_population_relative DOUBLE PRECISION,
        credit_score INTEGER, is_cardholder BOOLEAN, is_loanholder BOOLEAN,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_clients_snapshot ON clients(snapshot_date DESC);

    CREATE TABLE IF NOT EXISTS loan_applications (
        application_id TEXT PRIMARY KEY, client_id TEXT,
        submission_timestamp TIMESTAMPTZ, loan_amount DOUBLE PRECISION,
        loan_term_months INTEGER, interest_rate DOUBLE PRECISION,
        purpose TEXT, annuity DOUBLE PRECISION, goods_price DOUBLE PRECISION,
        contract_type TEXT
    );
    CREATE INDEX IF NOT EXISTS idx_loan_apps_client ON loan_applications(client_id);

    CREATE TABLE IF NOT EXISTS application_decisions (
        application_id TEXT PRIMARY KEY,
        status TEXT NOT NULL,
        decision_timestamp TIMESTAMPTZ, decision_by TEXT
    );
    CREATE INDEX IF NOT EXISTS idx_app_decisions_status ON application_decisions(status);

    CREATE TABLE IF NOT EXISTS payments (
        payment_id TEXT PRIMARY KEY, loan_id TEXT, client_id TEXT,
        application_id TEXT, payment_date DATE NOT NULL,
        amount DOUBLE PRECISION, principal_portion DOUBLE PRECISION,
        interest_portion DOUBLE PRECISION, days_late INTEGER,
        payment_method TEXT, num_payment INTEGER
    );
    CREATE INDEX IF NOT EXISTS idx_payments_loan ON payments(loan_id);
    CREATE INDEX IF NOT EXISTS idx_payments_date ON payments(payment_date DESC);

    CREATE TABLE IF NOT EXISTS card_authorizations (
        auth_id TEXT PRIMARY KEY, card_id TEXT, client_id TEXT,
        event_timestamp TIMESTAMPTZ, amount DOUBLE PRECISION,
        currency TEXT, merchant_category TEXT, merchant_name TEXT,
        approved BOOLEAN, decline_reason TEXT
    );
    CREATE INDEX IF NOT EXISTS idx_card_auths_client ON card_authorizations(client_id);
    CREATE INDEX IF NOT EXISTS idx_card_auths_timestamp ON card_authorizations(event_timestamp DESC);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-source
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-source
  template:
    metadata:
      labels:
        app: postgres-source
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        command:
        - /usr/local/bin/docker-entrypoint.sh
        - postgres
        - -c
        - wal_level=logical
        - -c
        - max_replication_slots=1
        - -c
        - max_wal_senders=1
        env:
        - name: POSTGRES_USER
          value: lending
        - name: POSTGRES_PASSWORD
          value: lending123
        - name: POSTGRES_DB
          value: lending_db
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        - name: pginit
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: pgdata
        emptyDir: {}
      - name: pginit
        configMap:
          name: postgres-source-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-source
spec:
  selector:
    app: postgres-source
  ports:
  - port: 5432
    targetPort: 5432