    ((SELECT customer_id FROM customers WHERE external_id='CUST-0017'),'2024-08-10',100000,36,7.30,'mortgage','funded'),
    ((SELECT customer_id FROM customers WHERE external_id='CUST-0018'),'2024-08-22',60000,48,10.50,'debt_consolidation','pending'),
    ((SELECT customer_id FROM customers WHERE external_id='CUST-0019'),'2024-09-05',85000,24,8.60,'auto','approved'),
