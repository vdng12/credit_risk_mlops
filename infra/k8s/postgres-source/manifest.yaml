    INSERT INTO loans (application_id, customer_id, disbursement_date, principal_amount, outstanding_balance, interest_rate, monthly_payment, term_months, months_paid, next_payment_date, status)
    SELECT la.application_id, la.customer_id, la.application_date + INTERVAL '7 days', la.loan_amount,
        ROUND(la.loan_amount * (1.0 - (EXTRACT(MONTH FROM AGE(NOW(), la.application_date + INTERVAL '7 days')) * 0.02)),2),
        la.interest_rate,
        ROUND(la.loan_amount * (la.interest_rate/100/12) * POWER(1+la.interest_rate/100/12, la.loan_term_months) / (POWER(1+la.interest_rate/100/12, la.loan_term_months)-1),2),
        la.loan_term_months,
        GREATEST(EXTRACT(MONTH FROM AGE(NOW(), la.application_date + INTERVAL '7 days'))::INTEGER,0),
        (NOW()+INTERVAL '30 days')::DATE,
        CASE WHEN la.customer_id=(SELECT customer_id FROM customers WHERE external_id='CUST-0006') THEN 'delinquent'
             WHEN la.customer_id=(SELECT customer_id FROM customers WHERE external_id='CUST-0013') THEN 'charged_off'
             WHEN la.customer_id=(SELECT customer_id FROM customers WHERE external_id='CUST-0018') THEN 'grace'
             ELSE 'current' END
    FROM loan_applications la WHERE la.status='funded';

    INSERT INTO payments (loan_id, payment_date, amount, principal_portion, interest_portion, days_late, payment_method)
    SELECT l.loan_id, l.disbursement_date + (generate_series(1, LEAST(l.months_paid+1,6)) * INTERVAL '30 days'),
        l.monthly_payment, ROUND(l.monthly_payment*0.65,2), ROUND(l.monthly_payment*0.35,2),
        CASE WHEN l.status='delinquent' AND generate_series(1, LEAST(l.months_paid+1,6)) > 4 THEN 15 ELSE 0 END,
        (ARRAY['bank_transfer','debit_card','auto_debit','cash'])[1+MOD(generate_series(1,LEAST(l.months_paid+1,6)),4)]
    FROM loans l;

    INSERT INTO delinquency_events (loan_id, event_date, days_past_due, event_type, notes)
    SELECT l.loan_id, l.next_payment_date - INTERVAL '15 days', 35, '31_60_dpd',
        'Automated delinquency flag — customer ' || c.external_id
    FROM loans l JOIN customers c ON l.customer_id = c.customer_id
    WHERE l.status='delinquent';
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-source
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-source
  template:
    metadata:
      labels:
        app: postgres-source
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          value: lending
        - name: POSTGRES_PASSWORD
          value: lending123
        - name: POSTGRES_DB
          value: lending_db
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        - name: pginit
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: pgdata
        emptyDir: {}
      - name: pginit
        configMap:
          name: postgres-source-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-source
spec:
  selector:
    app: postgres-source
  ports:
  - port: 5432
    targetPort: 5432