apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
      - name: seaweedfs
        image: chrislusf/seaweedfs:latest
        command:
        - /entrypoint.sh
        - mini
        - -s3
        - -s3.port=8333
        - -dir=/data
        - -master.port=9333
        - -filer.port=8888
        env:
        - name: AWS_ACCESS_KEY_ID
          value: seaweedfs
        - name: AWS_SECRET_ACCESS_KEY
          value: seaweedfs123
        - name: S3_BUCKET
          value: risk-data
        ports:
        - containerPort: 8333
        - containerPort: 8888
        - containerPort: 9333
        volumeMounts:
        - name: s3data
          mountPath: /data
      volumes:
      - name: s3data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  type: NodePort
  selector:
    app: seaweedfs
  ports:
  - name: s3
    port: 8333
    targetPort: 8333
    nodePort: 8333
  - name: filer
    port: 8888
    targetPort: 8888
    nodePort: 8888
  - name: master
    port: 9333
    targetPort: 9333
    nodePort: 9333